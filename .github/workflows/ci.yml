name: CI

# Runs only when started by hand (Actions → CI → Run workflow) or as the first step of a
# release (release.yml calls it), so everyday pushes use no Actions minutes.
# Linux is billed at 1× (Windows at 2×) and compiles Rust faster. TubeDeck's Windows-only
# code (Job Objects, hidden console windows) has Linux stand-ins, so all logic and tests run
# here; the Windows build itself is covered by the release workflow.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri's Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      # Type-checks and builds dist/, which the Rust build embeds.
      - name: Frontend build
        run: npm run build

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
