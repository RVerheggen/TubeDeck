name: Release

# Two ways to start a release of the version in src-tauri/tauri.conf.json:
#   • Recommended: Actions → Release → Run workflow (on main). The tag is created for you,
#     and the Rust build cache is saved under main, so the next release reuses it.
#   • Or push a tag like v0.1.2. This works too, but GitHub scopes caches per tag, so every
#     tag-started build compiles from scratch (~8–10 min).
# Either way: the CI tests run (Linux), the Windows installers are built and signed for the
# updater, and everything (including latest.json) goes into a DRAFT GitHub release.
# Installed copies only see the update once you publish the draft.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Windows installers
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Same cache for every release, whichever way it was started.
          shared-key: release-windows

      - name: Install npm dependencies
        run: npm ci

      - name: Check version and tag
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("${{ github.event_name }}" -eq "push") {
            if ("v$version" -ne "${{ github.ref_name }}") {
              throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version $version"
            }
          } else {
            if ("${{ github.ref }}" -ne "refs/heads/main") { throw "Run releases from main." }
            git fetch --tags --quiet
            if (git tag --list "v$version") {
              throw "v$version is already released. Bump the version (tauri.conf.json, Cargo.toml, package.json) first."
            }
          }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installers so installed copies accept them as updates. The private key
          # lives only in the repository's encrypted Actions secrets, never in the code.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # __VERSION__ is replaced with the version from tauri.conf.json; the tag is created
          # on this commit if it doesn't exist yet.
          tagName: v__VERSION__
          releaseName: TubeDeck v__VERSION__
          releaseBody: |
            See CHANGELOG.md for what's new.

            **New install:** download the `_x64-setup.exe` file below and run it. It installs for your user only and needs no administrator rights.
            The installer isn't code-signed, so Windows SmartScreen warns the first time: click **More info → Run anyway**.

            **Already installed:** TubeDeck shows "Update available" in the bottom-left corner. Click it to update.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
