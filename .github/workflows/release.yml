name: Release

# Two ways to start a release of the version in src-tauri/tauri.conf.json:
#   • Recommended: Actions → Release → Run workflow (on main). The tag is created for you,
#     and the Rust build cache is saved under main, so the next release reuses it.
#   • Or push a tag like v0.1.2. This works too, but GitHub scopes caches per tag, so every
#     tag-started build compiles from scratch (~8–10 min).
# Either way: the CI tests run (Linux), the Windows installers are built and signed for the
# updater, and everything (including latest.json) goes into a DRAFT GitHub release.
# Installed copies only see the update once you publish the draft.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Never run two releases at once: a second run waits, then its preflight sees the draft
# the first one created and stops.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Check version and existing releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Refuse versions that already have a release (published or draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          export VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          bash .github/scripts/check-release.sh
          bash .github/scripts/release-notes.sh --check "$VERSION"

  test:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Windows installers
    needs: [preflight, test]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Same cache for every release, whichever way it was started.
          shared-key: release-windows

      - name: Install npm dependencies
        run: npm ci

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          {
            echo "body<<END_OF_RELEASE_NOTES"
            bash .github/scripts/release-notes.sh "$(jq -r .version src-tauri/tauri.conf.json)"
            echo "END_OF_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installers so installed copies accept them as updates. The private key
          # lives only in the repository's encrypted Actions secrets, never in the code.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # __VERSION__ is replaced with the version from tauri.conf.json; the tag is created
          # on this commit if it doesn't exist yet.
          tagName: v__VERSION__
          releaseName: TubeDeck v__VERSION__
          # This version's CHANGELOG.md section plus install instructions. (It's also copied
          # into latest.json; the app itself lists the changelog entries since the installed
          # version instead.)
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
