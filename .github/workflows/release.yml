name: Release

# Push a tag like v0.1.0 (matching "version" in src-tauri/tauri.conf.json) to build the
# Windows installers and attach them to a draft GitHub release for review.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version $version"
          }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TubeDeck ${{ github.ref_name }}
          releaseBody: |
            See CHANGELOG.md for what's new.

            The installers are not code-signed yet, so Windows SmartScreen shows a warning the
            first time (More info → Run anyway). The NSIS installer (`-setup.exe`) installs per
            user and needs no administrator rights.
          releaseDraft: true
          prerelease: false
