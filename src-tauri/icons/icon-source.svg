<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- TubeDeck app icon: two stacked "deck" cards with a play triangle (matches the in-app logo). -->
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f06b6b"/>
      <stop offset="1" stop-color="#c94444"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3a3a3"/>
      <stop offset="1" stop-color="#e07c7c"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-9 470 470)">
    <rect x="120" y="150" width="660" height="620" rx="150" fill="url(#back)"/>
  </g>
  <rect x="234" y="250" width="680" height="660" rx="160" fill="url(#front)"/>
  <path d="M478 430 L478 730 L728 580 Z" fill="#ffffff" stroke="#ffffff" stroke-width="40" stroke-linejoin="round"/>
</svg>
