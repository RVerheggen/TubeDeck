[package]
name = "tubedeck"
version = "0.1.5"
description = "A modern yt-dlp desktop download manager"
authors = ["TubeDeck"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tubedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "http2", "charset"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
pretty_assertions = "1.4.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }
